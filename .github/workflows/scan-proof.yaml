# One planted finding, so the workflow leg of the scan can be seen finding one.
# Deliberate, and not for merge. The trigger has to be one that carries data an
# outsider controls, because a shell interpolation of data nobody outside can
# set is not the finding this is about.
name: Scan proof

on:
  pull_request:
    branches: ['**']

permissions: {}

jobs:
  injected:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Interpolate untrusted input straight into a shell
        run: echo "title is ${{ github.event.pull_request.title }}"
